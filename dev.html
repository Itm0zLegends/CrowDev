<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invention en cours | CrowDev</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
    <style>
        :root { 
            --accent: #3b82f6; 
            --accent-glow: rgba(59, 130, 246, 0.5);
            --bg: #050505; 
            --grid: rgba(255, 255, 255, 0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg); 
            color: #fff; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden;
            position: relative;
        }

        /* Grille futuriste en fond */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(var(--grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 50px 50px;
            mask-image: radial-gradient(circle at center, black, transparent 80%);
            z-index: -1;
        }

        /* Orbes plus dynamiques */
        .background-effect { position: fixed; inset: 0; z-index: -2; }
        .orb { 
            position: absolute; 
            border-radius: 50%; 
            filter: blur(120px); 
            opacity: 0.2; 
            animation: float 15s infinite ease-in-out; 
        }
        .orb1 { width: 600px; height: 600px; background: var(--accent); top: -200px; left: -100px; }
        .orb2 { width: 400px; height: 400px; background: #06b6d4; bottom: -100px; right: -50px; animation-delay: -7s; }

        .container { 
            text-align: center; 
            max-width: 600px; 
            padding: 3rem; 
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .icon-box {
            position: relative;
            display: inline-block;
            margin-bottom: 2rem;
        }

        .icon { 
            font-size: 4.5rem; 
            filter: drop-shadow(0 0 15px var(--accent-glow));
            animation: gear-spin 8s linear infinite;
            display: inline-block;
        }

        h1 { 
            font-size: clamp(2rem, 5vw, 3rem); 
            font-weight: 800; 
            margin-bottom: 1rem; 
            letter-spacing: -1.5px;
            background: linear-gradient(to bottom, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p { 
            color: #888; 
            margin-bottom: 3rem; 
            font-size: 1.1rem;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Barre de progression stylisée */
        .progress-wrapper {
            position: relative;
            padding: 4px;
            background: rgba(255,255,255,0.03);
            border-radius: 20px;
            margin-bottom: 2.5rem;
        }

        .progress-container { 
            width: 100%; 
            height: 10px; 
            background: #111; 
            border-radius: 10px; 
            overflow: hidden; 
            position: relative;
        }

        .progress-bar { 
            width: 70%; 
            height: 100%; 
            background: linear-gradient(90deg, #3b82f6, #06b6d4); 
            border-radius: 10px; 
            position: relative;
        }

        /* Effet de balayage lumineux sur la barre */
        .progress-bar::after {
            content: "";
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(
                90deg, 
                transparent, 
                rgba(255,255,255,0.4), 
                transparent
            );
            animation: scan 2s infinite linear;
        }

        .btn-back { 
            color: #555; 
            text-decoration: none; 
            font-size: 0.9rem; 
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 12px;
        }

        .btn-back:hover { 
            color: #fff; 
            background: rgba(255,255,255,0.05);
        }

        @keyframes scan {
            from { transform: translateX(-100%); }
            to { transform: translateX(100%); }
        }

        @keyframes gear-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes float { 
            0%, 100% { transform: translate(0,0) scale(1); } 
            50% { transform: translate(-30px, -20px) scale(1.05); } 
        }

        @media (max-width: 480px) {
            .container { padding: 2rem 1.5rem; margin: 1rem; }
        }
    </style>
</head>
<body>
    <div class="background-effect">
        <div class="orb orb1"></div>
        <div class="orb orb2"></div>
    </div>

    <div class="container">
        <div class="icon-box">
            <span class="icon">⚙️</span>
        </div>
        
        <h1>L'invention infuse.</h1>
        <p>Nos artisans forgent une nouvelle page.. Patience, ça arrive !</p>
        
        <div class="progress-wrapper">
            <div class="progress-container">
                <div class="progress-bar"></div>
            </div>
        </div>
        
        <a href="index.html" class="btn-back">
            <span>←</span> Retourner à l'acceuil
        </a>
    </div>
</body>
</html>
